name: Feature Report
description: Request new Feature
title: "[feature]: "
labels: ["🌱기능🌱"]
body:
  - type: input
    id: parentKey
    attributes:
      label: Epic Ticket Number
      description: WS-75 - 회원가입/로그인 | WS-79 - 투표 홈 | WS-88 - 쪽지 홈 | WS-104 - 알림 | WS-131 - 투표 결과 | WS-132 - 전체 | WS-134 - 쪽지 보관함
      placeholder: WS-132
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        이번 이슈도 파이팅 화이팅 🔥
  - type: textarea
    id: new-feature
    attributes:
      label: 작업 사항
      description: 어떤 기능을 추가할건가요?
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: Todo
      description: 작업사항을 나누어 작성해주세요!
      value: |
        - [ ] todo1
  - type: textarea
    id: etc
    attributes:
      label: 기타사항
      description: 추가로 기록이 필요한 경우 작성해주세요!